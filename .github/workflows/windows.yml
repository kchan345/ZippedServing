name: Windows server and client

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Configure Rust on the hosted runner
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
      - name: Formatting and dependency lockfile
        id: formatting
        shell: pwsh
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo update --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- src tests Cargo.lock
      - name: Prepare formatting fix
        if: failure() && steps.formatting.conclusion == 'failure'
        shell: pwsh
        run: |
          cargo fmt --all
          git diff --output=rustfmt.patch -- src tests Cargo.lock
      - uses: actions/upload-artifact@v4
        if: failure() && steps.formatting.conclusion == 'failure'
        with:
          name: rustfmt-fix
          path: rustfmt.patch
          retention-days: 3
      - name: Lint
        run: cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Tests
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Build standalone executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Test the release executable over HTTP
        shell: pwsh
        run: .\scripts\smoke-test.ps1 -Executable .\target\x86_64-pc-windows-msvc\release\zipped-file-serving.exe
      - name: Test chunked client and bounded memory
        shell: pwsh
        run: .\scripts\client-smoke-test.ps1 -Server .\target\x86_64-pc-windows-msvc\release\zipped-file-serving.exe -Client .\target\x86_64-pc-windows-msvc\release\zipped-file-client.exe -Large
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item .\target\x86_64-pc-windows-msvc\release\zipped-file-serving.exe .\dist\
          Copy-Item .\target\x86_64-pc-windows-msvc\release\zipped-file-client.exe .\dist\
          Copy-Item readme.md, architecture.md, LICENSE .\dist\
          Get-ChildItem .\dist\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content .\dist\SHA256SUMS.txt -Encoding ascii
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-diagnostics
          path: local-test\**\*.log
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: zipped-file-serving-windows-x64
          path: dist\
          if-no-files-found: error
          retention-days: 30
