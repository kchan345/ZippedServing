name: Windows executable

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Configure Rust on the hosted runner
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
      - name: Formatting
        id: formatting
        run: cargo fmt --all --check
      - name: Prepare formatting fix
        if: failure() && steps.formatting.conclusion == 'failure'
        shell: pwsh
        run: |
          cargo fmt --all
          git diff --output=rustfmt.patch -- src tests
      - uses: actions/upload-artifact@v4
        if: failure() && steps.formatting.conclusion == 'failure'
        with:
          name: rustfmt-fix
          path: rustfmt.patch
          retention-days: 3
      - name: Lint
        run: cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Tests
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Build standalone executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Test the release executable over HTTP
        shell: pwsh
        run: .\scripts\smoke-test.ps1 -Executable .\target\x86_64-pc-windows-msvc\release\zipped-file-serving.exe
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item .\target\x86_64-pc-windows-msvc\release\zipped-file-serving.exe .\dist\
          Copy-Item readme.md, architecture.md .\dist\
          $hash = (Get-FileHash .\dist\zipped-file-serving.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  zipped-file-serving.exe" | Set-Content .\dist\SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: zipped-file-serving-windows-x64
          path: dist\
          if-no-files-found: error
          retention-days: 30
